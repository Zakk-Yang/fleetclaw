<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetClaw Dashboard</title>
<style>
  :root {
    --bg: #0a0f16;
    --surface: #101822;
    --surface-2: #152131;
    --border: #243244;
    --text: #eef4fb;
    --muted: #91a0b3;
    --accent: #72d0ff;
    --green: #46d483;
    --yellow: #f0c45a;
    --red: #ff7870;
    --purple: #c7a9ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  /* ── Header ────────────────────────────────────── */

  .header {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(18px);
    background: rgba(10, 15, 22, 0.88);
    border-bottom: 1px solid var(--border);
  }

  .header__inner {
    max-width: 1520px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand__mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #4d86ff);
    color: #081018;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 15px;
  }

  .brand h1 {
    font-size: 16px;
    font-weight: 700;
  }

  .brand p,
  .header__meta,
  .eyebrow,
  .subtle,
  .field-label,
  .lane-card__meta,
  .role-meta,
  .decision-subtitle,
  .table-note {
    color: var(--muted);
  }

  .brand p,
  .header__meta,
  .subtle,
  .lane-card__meta,
  .role-meta,
  .decision-subtitle,
  .table-note {
    font-size: 11px;
  }

  .header__spacer { flex: 1; }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(145, 160, 179, 0.18);
    background: rgba(255, 255, 255, 0.03);
    font-size: 11px;
    color: var(--muted);
  }

  .refresh-btn {
    border: 1px solid rgba(114, 208, 255, 0.22);
    background: rgba(114, 208, 255, 0.08);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  .refresh-btn:hover {
    background: rgba(114, 208, 255, 0.18);
  }

  /* ── Layout ────────────────────────────────────── */

  .container {
    max-width: 1520px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    gap: 24px;
  }

  .section-header {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin-bottom: 12px;
  }

  .section-header h2 {
    font-size: 18px;
    font-weight: 700;
  }

  .section-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Cards ─────────────────────────────────────── */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .card-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .card-header h2 {
    font-size: 15px;
    font-weight: 700;
  }

  .card-body {
    padding: 16px;
  }

  /* ── Hero / Fleet overview ─────────────────────── */

  .hero-card .card-body {
    display: grid;
    gap: 16px;
  }

  .hero-title {
    display: grid;
    gap: 6px;
  }

  .hero-title h2 {
    font-size: 22px;
    line-height: 1.1;
  }

  .hero-title p {
    max-width: 62ch;
    color: #d8e1ec;
    font-size: 13px;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }

  .quick-stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .quick-stat {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    display: grid;
    gap: 2px;
    min-width: 120px;
  }

  .quick-stat__label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  .quick-stat__value {
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
  }

  .project-status-panel {
    display: grid;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(6, 11, 18, 0.5);
    border: 1px solid var(--border);
  }

  .project-status-top {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .project-status-summary {
    color: #d8e1ec;
    font-size: 13px;
  }

  .hero-links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(114, 208, 255, 0.22);
    background: rgba(114, 208, 255, 0.08);
    color: var(--text);
    font-size: 13px;
  }

  .link-pill:hover {
    background: rgba(114, 208, 255, 0.16);
    text-decoration: none;
  }

  /* ── Metrics ───────────────────────────────────── */

  .metrics-sections {
    display: grid;
    gap: 16px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }

  .metric-card {
    padding: 16px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: grid;
    gap: 10px;
  }

  .metric-card--good {
    border-color: rgba(70, 212, 131, 0.22);
  }

  .metric-card--warning {
    border-color: rgba(240, 196, 90, 0.26);
  }

  .metric-card--danger {
    border-color: rgba(255, 120, 112, 0.28);
  }

  .metric-card--info {
    border-color: rgba(114, 208, 255, 0.2);
  }

  .metric-card.hidden-metric {
    display: none;
  }

  .metric-card.hidden-metric.show-all {
    display: grid;
  }

  .metric-card__top {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 10px;
  }

  .metric-card__label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 700;
  }

  .metric-card__value {
    font-size: 22px;
    font-weight: 750;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .metric-card__tone {
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid rgba(145, 160, 179, 0.16);
    background: rgba(255, 255, 255, 0.03);
  }

  .metric-card__body {
    display: grid;
    gap: 8px;
  }

  .metric-card__secondary {
    color: #d9e4ef;
    font-size: 13px;
  }

  .metric-card__definition,
  .metric-card__formula {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .metric-card__definition strong,
  .metric-card__formula strong {
    color: var(--text);
    font-weight: 600;
  }

  .metric-card__breakdown {
    display: grid;
    gap: 8px;
    margin-top: 2px;
  }

  .metric-breakdown-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px 12px;
    align-items: start;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(145, 160, 179, 0.08);
  }

  .metric-breakdown-row__label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .metric-breakdown-row__value {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .metric-breakdown-row__note {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }

  .metric-section {
    display: grid;
    gap: 14px;
  }

  .metric-section__header {
    display: grid;
    gap: 4px;
  }

  .metric-section__header h3 {
    font-size: 16px;
  }

  .metric-toggle-btn {
    border: 1px solid var(--border);
    background: rgba(114, 208, 255, 0.06);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 8px;
  }

  .metric-toggle-btn:hover {
    background: rgba(114, 208, 255, 0.14);
    color: var(--text);
  }

  /* ── Alerts ────────────────────────────────────── */

  .alert-strip {
    display: grid;
    gap: 16px;
  }

  .alert-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }

  .alert-card {
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: grid;
    gap: 8px;
    align-content: start;
  }

  .alert-card__title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 700;
  }

  .alert-card__detail {
    color: #d9e4ef;
    font-size: 13px;
    line-height: 1.45;
  }

  .alert-card--ok {
    border-color: rgba(70, 212, 131, 0.22);
  }

  .alert-card--warning {
    border-color: rgba(240, 196, 90, 0.26);
  }

  .alert-card--danger {
    border-color: rgba(255, 120, 112, 0.28);
  }

  /* ── Lanes ─────────────────────────────────────── */

  .lane-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }

  .lane-card {
    padding: 14px;
    border-radius: 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: grid;
    gap: 8px;
  }

  .lane-card__top {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 10px;
  }

  .lane-card h3 {
    font-size: 14px;
    font-weight: 700;
  }

  .lane-card__summary {
    color: #d7e0ea;
    font-size: 13px;
  }

  .lane-card__decision {
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: grid;
    gap: 4px;
  }

  /* ── Role sections ─────────────────────────────── */

  .role-stack {
    display: grid;
    gap: 14px;
  }

  .role-section .card-header {
    align-items: start;
    justify-content: space-between;
  }

  .role-title {
    display: grid;
    gap: 4px;
  }

  .role-title h2 {
    font-size: 16px;
  }

  .role-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.9fr);
    gap: 16px;
  }

  .role-main,
  .role-side {
    display: grid;
    gap: 14px;
  }

  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .overview-box,
  .decision-box,
  .runtime-box {
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: grid;
    gap: 8px;
  }

  .overview-box strong,
  .decision-box strong,
  .runtime-box strong {
    font-size: 13px;
  }

  .field-list {
    display: grid;
    gap: 6px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
  }

  .field-label {
    min-width: 130px;
    color: var(--muted);
  }

  .field-value {
    color: var(--text);
    flex: 1;
  }

  /* ── Tabs ──────────────────────────────────────── */

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .tab {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .tab.active {
    color: var(--text);
    border-color: rgba(114, 208, 255, 0.28);
    background: rgba(114, 208, 255, 0.12);
  }

  .tab-content {
    display: none;
    margin-top: 14px;
  }

  .tab-content.active {
    display: block;
  }

  pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: #cfd9e4;
    max-height: 420px;
    overflow-y: auto;
  }

  .decision-box pre,
  .message-box pre {
    max-height: none;
  }

  /* ── Status badges ─────────────────────────────── */

  .status-badge,
  .usage-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }

  .status-working { background: rgba(70, 212, 131, 0.14); color: var(--green); }
  .status-blocked { background: rgba(255, 120, 112, 0.14); color: var(--red); }
  .status-done { background: rgba(77, 134, 255, 0.14); color: #8eb1ff; }
  .status-ready-for-review { background: rgba(240, 196, 90, 0.15); color: var(--yellow); }
  .status-monitoring { background: rgba(199, 169, 255, 0.16); color: var(--purple); }
  .status-unknown { background: rgba(145, 160, 179, 0.18); color: var(--muted); }

  .usage-ok { background: rgba(70, 212, 131, 0.14); color: var(--green); }
  .usage-warning { background: rgba(240, 196, 90, 0.15); color: var(--yellow); }
  .usage-compact { background: rgba(255, 120, 112, 0.14); color: var(--red); }

  /* ── Support / Config section ──────────────────── */

  .support-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
    gap: 16px;
  }

  .support-stack {
    display: grid;
    gap: 16px;
  }

  .config-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .config-tab {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .config-tab.active {
    color: var(--text);
    border-color: rgba(114, 208, 255, 0.28);
    background: rgba(114, 208, 255, 0.12);
  }

  .config-pane {
    display: none;
  }

  .config-pane.active {
    display: block;
  }

  /* ── Forms / Settings ──────────────────────────── */

  .feedback-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.95fr);
    gap: 16px;
  }

  .settings-agent-grid {
    display: grid;
    gap: 10px;
  }

  .settings-agent-row {
    display: grid;
    grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(145, 160, 179, 0.1);
    background: rgba(255, 255, 255, 0.02);
  }

  .settings-agent-name {
    font-size: 13px;
    font-weight: 700;
    color: #dbe5ef;
  }

  .settings-note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }

  .feedback-form,
  .feedback-feed,
  .feedback-entry {
    display: grid;
    gap: 12px;
  }

  .feedback-form__grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .feedback-field {
    display: grid;
    gap: 6px;
  }

  .feedback-field label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .feedback-input,
  .feedback-textarea,
  .feedback-select {
    width: 100%;
    border-radius: 8px;
    border: 1px solid rgba(145, 160, 179, 0.16);
    background: rgba(5, 10, 16, 0.45);
    color: var(--text);
    padding: 9px 10px;
    font: inherit;
    font-size: 13px;
  }

  .feedback-textarea {
    min-height: 140px;
    resize: vertical;
    line-height: 1.5;
  }

  .feedback-input:focus,
  .feedback-textarea:focus,
  .feedback-select:focus {
    outline: none;
    border-color: rgba(114, 208, 255, 0.42);
    box-shadow: 0 0 0 3px rgba(114, 208, 255, 0.12);
  }

  .feedback-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #d8e1ec;
  }

  .feedback-checkbox input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  .feedback-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .feedback-submit {
    border: 1px solid rgba(114, 208, 255, 0.24);
    background: rgba(114, 208, 255, 0.12);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  .feedback-submit:hover {
    background: rgba(114, 208, 255, 0.22);
  }

  .feedback-submit:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  .feedback-note {
    font-size: 12px;
    color: var(--muted);
  }

  .feedback-status {
    font-size: 12px;
    color: var(--muted);
  }

  .feedback-status--ok {
    color: var(--green);
  }

  .feedback-status--error {
    color: var(--red);
  }

  .feedback-feed {
    align-content: start;
  }

  .feedback-entry {
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
  }

  .feedback-entry__top {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .feedback-entry__meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .feedback-entry__message {
    white-space: pre-wrap;
    word-break: break-word;
    color: #dbe5ef;
    font-size: 13px;
  }

  .feedback-entry__surface {
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Tables ────────────────────────────────────── */

  .table-wrap { overflow-x: auto; }

  table.metrics-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .metrics-table th,
  .metrics-table td {
    padding: 6px 10px;
    border-top: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }

  .metrics-table th {
    color: var(--muted);
    font-weight: 600;
  }

  .metrics-table td.right,
  .metrics-table th.right {
    text-align: right;
  }

  /* ── Responsive ────────────────────────────────── */

  @media (max-width: 1120px) {
    .feedback-grid,
    .role-layout,
    .support-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 820px) {
    .overview-grid,
    .feedback-form__grid {
      grid-template-columns: 1fr;
    }

    .settings-agent-row {
      grid-template-columns: 1fr;
    }

    .container,
    .header__inner {
      padding: 16px;
    }

    .quick-stats {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header__inner">
    <div class="brand">
      <div class="brand__mark">FC</div>
      <div>
        <h1>FleetClaw</h1>
        <p id="header-subtitle">Multi-agent coordination</p>
      </div>
    </div>
    <span class="tag" id="project-name">loading...</span>
    <span class="header__meta" id="last-update"></span>
    <div class="header__spacer"></div>
    <button class="refresh-btn" onclick="refresh()">Refresh</button>
  </div>
</header>

<main class="container">
  <section id="fleet-overview"></section>
  <section id="role-snapshot"></section>
  <section id="health-metrics"></section>
  <section id="fleet-lanes" class="role-stack"></section>
  <section id="config-support"></section>
</main>

<script>
let dashboardData = null;
let feedbackDraft = {
  target: 'supervisor',
  severity: 'issue',
  surface: '',
  blocksAcceptance: false,
  message: '',
};
let feedbackNotice = null;
let feedbackSubmitting = false;
let runtimeSettingsDraft = null;
let runtimeSettingsNotice = null;
let runtimeSettingsSubmitting = false;
let showAllMetrics = false;

async function fetchAll() {
  const response = await fetch('/api/dashboard');
  if (!response.ok) {
    throw new Error(`Dashboard API failed: ${response.status}`);
  }
  dashboardData = await response.json();
  render();
}

function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function statusClass(state) {
  if (!state) return 'status-unknown';
  const value = state.toLowerCase();
  if (value === 'working') return 'status-working';
  if (value === 'blocked') return 'status-blocked';
  if (value === 'done') return 'status-done';
  if (value.includes('review')) return 'status-ready-for-review';
  if (value.includes('monitor')) return 'status-monitoring';
  return 'status-unknown';
}

function decisionClass(decision) {
  if (!decision) return 'status-unknown';
  const value = decision.toUpperCase();
  if (value === 'ACCEPT_DONE') return 'status-done';
  if (value === 'STOP') return 'status-blocked';
  if (value === 'REDIRECT') return 'status-ready-for-review';
  if (value === 'CONTINUE') return 'status-working';
  return 'status-monitoring';
}

function usageClass(status) {
  if (status === 'COMPACT NOW') return 'usage-compact';
  if (status === 'WARNING') return 'usage-warning';
  return 'usage-ok';
}

function fmtPct(value) {
  if (value === null || value === undefined || value === '' || Number.isNaN(Number(value))) return '-';
  return `${Number(value).toFixed(2)}%`;
}

function fmtInt(value) {
  if (value === null || value === undefined || value === '') return '-';
  const number = Number(value);
  if (!Number.isFinite(number)) return '-';
  return number.toLocaleString();
}

function formatRate(value) {
  if (value === null || value === undefined || value === '') return 'warming up';
  const number = Number(value);
  if (!Number.isFinite(number) || number < 0) return 'warming up';
  return `${fmtInt(Math.round(number))} tok/hr`;
}

function formatElapsedHours(value) {
  if (value === null || value === undefined || value === '' || Number.isNaN(Number(value))) return 'warming up';
  const hours = Number(value);
  if (!Number.isFinite(hours) || hours < 0) return 'warming up';
  if (hours < (1 / 60)) return '<1 min';
  if (hours < 1) return `${Math.max(1, Math.round(hours * 60))} min`;
  if (hours < 10) return `${hours.toFixed(1)} hr`;
  return `${Math.round(hours)} hr`;
}

function fmtTime(value) {
  if (!value) return '-';
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) return esc(value);
  return parsed.toLocaleString();
}

function renderUsageBadge(status) {
  if (!status) return '<span class="usage-badge status-unknown">unknown</span>';
  return `<span class="usage-badge ${usageClass(status)}">${esc(status)}</span>`;
}

function renderStatusBadge(state) {
  const label = state || 'unknown';
  return `<span class="status-badge ${statusClass(label)}">${esc(label)}</span>`;
}

function renderBudgetSummary(budget) {
  if (!budget || !budget.startup || !budget.withShared) return 'No budget snapshot yet';
  return `${fmtPct(budget.startup.usagePct)} startup / ${fmtPct(budget.withShared.usagePct)} with shared`;
}

function renderSessionSummary(session) {
  if (!session) return 'No tokens reported yet';
  return `${fmtPct(session.usagePct)} (${fmtInt(session.totalTokens)} / ${fmtInt(session.contextTokens)})`;
}

function firstMeaningfulLine(text) {
  if (!text) return '';
  const lines = String(text).split('\n').map((line) => line.trim()).filter(Boolean);
  return lines.find((line) => !line.startsWith('SUPERVISOR_DECISION:') && !line.startsWith('[') && !line.startsWith('#')) || lines[0] || '';
}

function lastMeaningfulLine(text) {
  if (!text) return '';
  const lines = String(text).split('\n').map((line) => line.trim()).filter(Boolean);
  for (let index = lines.length - 1; index >= 0; index -= 1) {
    const line = lines[index];
    if (!line.startsWith('SUPERVISOR_DECISION:') && !line.startsWith('#')) {
      return line;
    }
  }
  return lines[lines.length - 1] || '';
}

function renderDecisionSummary(decision) {
  if (!decision) return 'No recorded supervisor instruction yet.';
  const nextMatch = decision.text.match(/NEXT:\s*(.+)/);
  const reasonMatch = decision.text.match(/REASON:\s*(.+)/);
  const next = nextMatch ? nextMatch[1].trim() : '';
  const reason = reasonMatch ? reasonMatch[1].trim() : '';
  const sentAt = decision.sentAt ? new Date(decision.sentAt).toLocaleString() : '';
  let parts = [`<strong>${esc(decision.decision)}</strong>`];
  if (next) parts.push(esc(next));
  if (reason) parts.push(`<em>${esc(reason)}</em>`);
  if (sentAt) parts.push(`<span style="opacity:0.6;font-size:0.8rem;">${esc(sentAt)}</span>`);
  return parts.join(' · ');
}

function severityClass(severity) {
  const value = String(severity || '').toLowerCase();
  if (value === 'blocking') return 'status-blocked';
  if (value === 'issue') return 'status-ready-for-review';
  return 'status-monitoring';
}

function formatFeedbackStatus(status) {
  const value = String(status || '').toLowerCase();
  if (!value) return 'unknown';
  if (value === 'dispatch-error') return 'dispatch error';
  return value;
}

function formatControlPlaneStatus(status) {
  const value = String(status || '').toLowerCase();
  if (!value) return 'unknown';
  if (value === 'dispatch-error') return 'dispatch error';
  return value;
}

function renderFeedbackEntries(entries) {
  if (!entries || !entries.length) {
    return '<div class="subtle">No human feedback submitted from the dashboard yet.</div>';
  }

  return `
    <div class="feedback-feed">
      ${entries.map((entry) => `
        <article class="feedback-entry">
          <div class="feedback-entry__top">
            <div>
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <strong>${esc(entry.targetLabel || entry.target || 'Supervisor')}</strong>
                <span class="status-badge ${severityClass(entry.severity)}">${esc(entry.severity || 'issue')}</span>
                ${entry.blocksAcceptance ? '<span class="status-badge status-blocked">blocks acceptance</span>' : ''}
              </div>
              <div class="feedback-entry__meta">
                <span>${fmtTime(entry.createdAt)}</span>
                <span>status: ${esc(formatFeedbackStatus(entry.status))}</span>
              </div>
            </div>
          </div>
          ${entry.surface ? `<div class="feedback-entry__surface">Surface: ${esc(entry.surface)}</div>` : ''}
          <div class="feedback-entry__message">${esc(entry.message || '')}</div>
        </article>
      `).join('')}
    </div>
  `;
}

function renderControlPlaneEntries(entries) {
  if (!entries || !entries.length) {
    return '<div class="subtle">No control-plane notifications recorded yet.</div>';
  }

  return `
    <div class="feedback-feed">
      ${entries.map((entry) => `
        <article class="feedback-entry">
          <div class="feedback-entry__top">
            <div>
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <strong>${esc(entry.direction === 'supervisor_to_agent' ? 'Supervisor -> agent' : 'Agent -> supervisor')}</strong>
                <span class="status-badge ${entry.status === 'dispatch-error' ? 'status-blocked' : 'status-monitoring'}">${esc(formatControlPlaneStatus(entry.status))}</span>
                ${entry.decision ? `<span class="status-badge ${decisionClass(entry.decision)}">${esc(entry.decision)}</span>` : ''}
                ${entry.request ? `<span class="status-badge status-ready-for-review">${esc(entry.request)}</span>` : ''}
              </div>
              <div class="feedback-entry__meta">
                <span>${fmtTime(entry.createdAt)}</span>
                <span>${esc(entry.eventId || '-')}</span>
              </div>
            </div>
          </div>
          <div class="feedback-entry__surface">
            ${entry.agentId ? `Agent: ${esc(entry.agentId)}` : ''}
            ${entry.eventType ? ` · Event: ${esc(entry.eventType)}` : ''}
            ${entry.state ? ` · State: ${esc(entry.state)}` : ''}
          </div>
          ${entry.summary ? `<div class="feedback-entry__message">${esc(entry.summary)}</div>` : ''}
          ${entry.next ? `<div class="feedback-entry__message">${esc(entry.next)}</div>` : ''}
          ${entry.reason ? `<div class="feedback-entry__message">${esc(entry.reason)}</div>` : ''}
          ${entry.error ? `<div class="feedback-entry__message">${esc(entry.error)}</div>` : ''}
        </article>
      `).join('')}
    </div>
  `;
}

function renderMarkdownTable(rows) {
  if (!rows.length) return '<div class="subtle">No markdown budget data yet.</div>';

  const body = rows.map((row) => `
    <tr>
      <td>${esc(row.roleId)}</td>
      <td>${esc(row.readSet)}</td>
      <td class="right mono">${fmtInt(row.fileCount)}</td>
      <td class="right mono">${fmtInt(row.tokens)}</td>
      <td class="right mono">${fmtPct(row.usagePct)}</td>
    </tr>
  `).join('');

  return `
    <div class="table-wrap">
      <table class="metrics-table">
        <thead>
          <tr>
            <th>Role</th>
            <th>Read set</th>
            <th class="right">Files</th>
            <th class="right">Tokens</th>
            <th class="right">Usage</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

function renderLiveTable(rows) {
  if (!rows.length) return '<div class="subtle">No live sessions are reporting token usage yet.</div>';

  const body = rows.map((row) => `
    <tr>
      <td>${esc(row.displayAgentId)}</td>
      <td>${esc(row.sessionLabel)}</td>
      <td class="right mono">${fmtInt(row.totalTokens)}</td>
      <td class="right mono">${fmtInt(row.contextTokens)}</td>
      <td class="right mono">${fmtPct(row.usagePct)}</td>
      <td>${renderUsageBadge(row.status)}</td>
    </tr>
  `).join('');

  return `
    <div class="table-wrap">
      <table class="metrics-table">
        <thead>
          <tr>
            <th>Role</th>
            <th>Session</th>
            <th class="right">Tokens</th>
            <th class="right">Limit</th>
            <th class="right">Usage</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

function renderCronTable(rows) {
  if (!rows.length) return '<div class="subtle">No supervisor cron runs are reporting token usage yet.</div>';

  const body = rows.map((row) => `
    <tr>
      <td>${esc(row.sessionLabel)}</td>
      <td class="right mono">${fmtInt(row.totalTokens)}</td>
      <td class="right mono">${fmtInt(row.contextTokens)}</td>
      <td class="right mono">${fmtPct(row.usagePct)}</td>
      <td>${renderUsageBadge(row.status)}</td>
    </tr>
  `).join('');

  return `
    <div class="table-wrap">
      <table class="metrics-table">
        <thead>
          <tr>
            <th>Cron run</th>
            <th class="right">Tokens</th>
            <th class="right">Limit</th>
            <th class="right">Usage</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

function renderTabs(sectionId, tabs) {
  const buttons = tabs.map((tab, index) => `
    <button class="tab ${index === 0 ? 'active' : ''}" data-pane="${esc(tab.key)}">${esc(tab.label)}</button>
  `).join('');

  const panes = tabs.map((tab, index) => `
    <div class="tab-content ${index === 0 ? 'active' : ''}" data-role-tabs="${esc(sectionId)}" data-pane="${esc(tab.key)}">
      ${tab.content}
    </div>
  `).join('');

  return `
    <div class="tabs" data-tabs="${esc(sectionId)}">${buttons}</div>
    ${panes}
  `;
}

function renderLaneCard(role) {
  const sessionLink = role.sessionUrl
    ? `<a href="${esc(role.sessionUrl)}" target="_blank" style="color:var(--accent);text-decoration:none;font-size:0.82rem;">Open in OpenClaw &rarr;</a>`
    : '';
  const metaItems = [role.model, role.focusDirs, role.lastUpdated].filter(Boolean);
  const nextStepHtml = role.nextStep
    ? `<div class="lane-card__decision"><strong>Next step</strong><div class="lane-card__meta">${esc(role.nextStep)}</div></div>`
    : '';
  const supervisorHtml = role.supervisorInstruction
    ? `<div class="lane-card__decision"><strong>Latest supervisor instruction</strong><div class="lane-card__meta">${role.supervisorInstruction}</div></div>`
    : '';
  return `
    <article class="lane-card">
      <div class="lane-card__top">
        <div>
          <h3>${esc(role.title)} ${sessionLink}</h3>
          <div class="lane-card__meta">${esc(metaItems.join(' · '))}</div>
        </div>
        ${renderStatusBadge(role.state)}
      </div>
      <div class="lane-card__summary">${esc(role.summary)}</div>
      <div class="lane-card__meta">Context: ${esc(role.context)}</div>
      ${nextStepHtml}
      ${supervisorHtml}
    </article>
  `;
}

function metricToneClass(tone) {
  const value = String(tone || 'info').toLowerCase();
  if (value === 'good') return 'metric-card--good';
  if (value === 'warning') return 'metric-card--warning';
  if (value === 'danger') return 'metric-card--danger';
  return 'metric-card--info';
}

function alertLevelClass(level) {
  const value = String(level || 'ok').toLowerCase();
  if (value === 'danger') return 'alert-card--danger';
  if (value === 'warning') return 'alert-card--warning';
  return 'alert-card--ok';
}

function renderAlertStrip(analytics) {
  const alerts = analytics?.alerts || [];
  if (!alerts.length) return '';

  return `
    <div class="alert-strip">
      <div class="alert-grid">
        ${alerts.map((alert) => `
          <article class="alert-card ${alertLevelClass(alert.level)}">
            <div class="alert-card__title">${esc(alert.title || 'Alert')}</div>
            <div class="alert-card__detail">${esc(alert.detail || '')}</div>
          </article>
        `).join('')}
      </div>
    </div>
  `;
}

const ESSENTIAL_METRIC_IDS = new Set([
  'project-tokens', 'supervisor-tokens-pct', 'push-vs-poll',
  'commits-today', 'active-agents', 'review-latency',
]);

function renderMetricSections(analytics) {
  const sections = analytics?.sections || [];
  if (!sections.length) return '';

  let hasHiddenMetrics = false;

  const sectionsHtml = sections.map((section) => {
    const allMetrics = section.metrics || [];

    const metricsHtml = allMetrics.map((metric, idx) => {
      const isEssential = ESSENTIAL_METRIC_IDS.has(metric.id) || idx === 0;
      const hiddenClass = isEssential ? '' : 'hidden-metric';
      if (!isEssential) hasHiddenMetrics = true;

      return `
        <article class="metric-card ${metricToneClass(metric.tone)} ${hiddenClass} ${showAllMetrics && !isEssential ? 'show-all' : ''}" ${!isEssential ? 'data-extra-metric' : ''}>
          <div class="metric-card__top">
            <div>
              <div class="metric-card__label">${esc(metric.label || 'Metric')}</div>
              <div class="metric-card__value">${esc(metric.value || '-')}</div>
            </div>
            <span class="metric-card__tone">${esc(metric.tone || 'info')}</span>
          </div>
          <div class="metric-card__body">
            ${metric.secondary ? `<div class="metric-card__secondary">${esc(metric.secondary)}</div>` : ''}
            ${Array.isArray(metric.breakdown) && metric.breakdown.length ? `
              <div class="metric-card__breakdown">
                ${metric.breakdown.map((item) => `
                  <div class="metric-breakdown-row">
                    <div class="metric-breakdown-row__label">${esc(item.label || '-')}</div>
                    <div class="metric-breakdown-row__value">${esc(item.value || '-')}</div>
                    ${item.note ? `<div class="metric-breakdown-row__note">${esc(item.note)}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${metric.definition ? `<div class="metric-card__definition"><strong>Definition</strong> ${esc(metric.definition)}</div>` : ''}
            ${metric.formula ? `<div class="metric-card__formula"><strong>Formula</strong> ${esc(metric.formula)}</div>` : ''}
          </div>
        </article>
      `;
    }).join('');

    return `
      <article class="card metric-section">
        <div class="card-header">
          <div class="metric-section__header">
            <div class="eyebrow">Operational indicators</div>
            <h3>${esc(section.title || 'Metrics')}</h3>
            <div class="subtle">${esc(section.subtitle || '')}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="metric-grid">${metricsHtml}</div>
        </div>
      </article>
    `;
  }).join('');

  const toggleBtn = hasHiddenMetrics
    ? `<button class="metric-toggle-btn" data-metric-toggle>${showAllMetrics ? 'Show fewer metrics' : 'Show all metrics'}</button>`
    : '';

  return `
    <div class="metrics-sections">
      ${sectionsHtml}
      ${toggleBtn}
    </div>
  `;
}

function renderAgentSection(agent) {
  const state = agent.statusFields.state || 'unknown';
  const tabs = [
    {
      key: 'status',
      label: 'STATUS',
      content: `<pre>${esc(agent.files.status || 'No STATUS.md')}</pre>`,
    },
    {
      key: 'supervisor',
      label: 'Supervisor',
      content: agent.latestSupervisorDecision
        ? `<div class="message-box"><pre>${esc(agent.latestSupervisorDecision.text)}</pre></div>`
        : '<div class="subtle">No recorded supervisor decision yet.</div>',
    },
    {
      key: 'brief',
      label: 'BRIEF',
      content: `<pre>${esc(agent.files.brief || 'No BRIEF.md')}</pre>`,
    },
    {
      key: 'plan',
      label: 'PLAN',
      content: `<pre>${esc(agent.files.plan || 'No PLAN.md yet')}</pre>`,
    },
    {
      key: 'memory',
      label: 'MEMORY',
      content: `<pre>${esc(agent.files.memory || 'No MEMORY.md')}</pre>`,
    },
    {
      key: 'soul',
      label: 'SOUL',
      content: `<pre>${esc(agent.files.soul || 'No SOUL.md')}</pre>`,
    },
  ];

  return `
    <section class="card role-section">
      <div class="card-header">
        <div class="role-title">
          <div class="eyebrow">Agent lane</div>
          <h2>${esc(agent.id)}</h2>
          <div class="role-meta">Model: ${esc(agent.model)} · Thinking: ${esc(agent.thinking)} · Focus: ${esc(agent.focusDirs.join(', ') || '-')}</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          ${renderStatusBadge(state)}
          ${agent.sessionUrl ? `<a class="link-pill" href="${esc(agent.sessionUrl)}" target="_blank">Open session</a>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="role-layout">
          <div class="role-main">
            <div class="overview-grid">
              <div class="overview-box">
                <strong>Checkpoint</strong>
                <div class="field-list">
                  <div class="field-row"><span class="field-label">Summary</span><span class="field-value">${esc(agent.statusFields.summary || '-')}</span></div>
                  <div class="field-row"><span class="field-label">Next step</span><span class="field-value">${esc(agent.statusFields['next step'] || '-')}</span></div>
                  <div class="field-row"><span class="field-label">Blocker</span><span class="field-value">${esc(agent.statusFields.blocker || 'none')}</span></div>
                </div>
              </div>
              <div class="overview-box">
                <strong>Review state</strong>
                <div class="field-list">
                  <div class="field-row"><span class="field-label">Tests</span><span class="field-value">${esc(agent.statusFields.tests || '-')}</span></div>
                  <div class="field-row"><span class="field-label">Decision needed</span><span class="field-value">${esc(agent.statusFields['needs supervisor decision'] || 'no')}</span></div>
                  <div class="field-row"><span class="field-label">Last event id</span><span class="field-value mono">${esc(agent.statusFields['last event id'] || 'none')}</span></div>
                  <div class="field-row"><span class="field-label">Last updated</span><span class="field-value">${esc(agent.lastUpdatedDisplay || '-')}</span></div>
                </div>
              </div>
            </div>
            ${renderTabs(`agent-${agent.id}`, tabs)}
          </div>
          <div class="role-side">
            <div class="decision-box">
              <strong>Latest supervisor instruction</strong>
              ${agent.latestSupervisorDecision ? `
                <div><span class="status-badge ${decisionClass(agent.latestSupervisorDecision.decision)}">${esc(agent.latestSupervisorDecision.decision)}</span></div>
                <div class="decision-subtitle">Sent ${fmtTime(agent.latestSupervisorDecision.sentAt)}</div>
                <pre>${esc(agent.latestSupervisorDecision.text)}</pre>
              ` : '<div class="subtle">No recorded instruction yet.</div>'}
            </div>
            <div class="runtime-box">
              <strong>Runtime</strong>
              <div class="field-list">
                <div class="field-row"><span class="field-label">Main session</span><span class="field-value">${renderSessionSummary(agent.mainSession)}</span></div>
                <div class="field-row"><span class="field-label">Instruction load</span><span class="field-value">${renderBudgetSummary(agent.instructionBudget)}</span></div>
                <div class="field-row"><span class="field-label">Files touched</span><span class="field-value">${esc(agent.statusFields['files touched'] || '-')}</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  `;
}

function renderSupervisorSection(supervisor, projectData, feedback) {
  const tabs = [
    {
      key: 'memory',
      label: 'Latest memory',
      content: `<pre>${esc(supervisor.latestMemory || 'No memory logs yet')}</pre>`,
    },
    {
      key: 'roster',
      label: 'ROSTER',
      content: `<pre>${esc(supervisor.roster || 'No ROSTER.md')}</pre>`,
    },
    {
      key: 'status',
      label: 'STATUS',
      content: `<pre>${esc(supervisor.status || 'No STATUS.md')}</pre>`,
    },
    {
      key: 'feedback',
      label: 'Human feedback',
      content: renderFeedbackEntries(feedback?.entries || []),
    },
  ];

  return `
    <section class="card role-section">
      <div class="card-header">
        <div class="role-title">
          <div class="eyebrow">Supervisor</div>
          <h2>Supervisor</h2>
          <div class="role-meta">Checks every ${esc(projectData.supervisor.checkInterval)} minutes · Reconciles every ${esc(projectData.supervisor.statusReconcileIntervalSecs)} seconds</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          ${renderStatusBadge('monitoring')}
          ${supervisor.sessionUrl ? `<a class="link-pill" href="${esc(supervisor.sessionUrl)}" target="_blank">Open session</a>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="role-layout">
          <div class="role-main">
            <div class="overview-grid">
              <div class="overview-box">
                <strong>Control loop</strong>
                <div class="field-list">
                  <div class="field-row"><span class="field-label">Main session</span><span class="field-value">${renderSessionSummary(supervisor.mainSession)}</span></div>

function renderRoleSnapshot(agents, supervisor, projectData) {
  const laneCards = [];
  const supModel = projectData?.supervisor?.model || 'unknown';
  const supInterval = projectData?.supervisor?.checkInterval || '?';
  const ps = projectData?.status?.fields || {};
  const supState = ps.state || 'monitoring';
  const supSummary = ps.summary || lastMeaningfulLine(supervisor.latestMemory || 'Supervisor is monitoring the fleet.') || 'Supervisor is monitoring the fleet.';
  const supLastUpdated = ps['last updated'] || (supervisor.mainSession ? 'active' : '');
  const supNextAction = ps['next action'] || 'Reviews checkpoints, inspects git state, and routes the next decision.';
  laneCards.push(renderLaneCard({
    title: 'Supervisor',
    model: supModel,
    focusDirs: `every ${supInterval}m`,
    lastUpdated: supLastUpdated,
    state: supState,
    summary: supSummary,
    context: renderSessionSummary(supervisor.mainSession),
    sessionUrl: supervisor.sessionUrl || null,
    nextStep: supNextAction,
  }));

  for (const agent of agents) {
    const sf = agent.statusFields || {};
    laneCards.push(renderLaneCard({
      title: agent.id,
      model: agent.model || 'unknown',
      focusDirs: agent.focusDirs.join(', ') || 'shared workspace',
      lastUpdated: sf['last updated'] || agent.lastUpdatedDisplay || 'no checkpoint',
      state: sf.state || 'unknown',
      summary: sf.summary || 'No summary yet.',
      context: renderSessionSummary(agent.mainSession),
      sessionUrl: agent.sessionUrl || null,
      nextStep: sf['next step'] && sf['next step'] !== 'none' ? sf['next step'] : null,
      supervisorInstruction: agent.latestSupervisorDecision ? renderDecisionSummary(agent.latestSupervisorDecision) : null,
    }));
  }

  return `
    <div class="section-header">
      <h2>Role Snapshot</h2>
      <p class="section-subtitle">Compact overview of all fleet lanes</p>
    </div>
    <section class="card">
      <div class="card-body">
        <div class="lane-grid">${laneCards.join('')}</div>
      </div>
    </section>
  `;
}

/* ── Wiring ──────────────────────────────────────── */

function wireTabs() {
  document.querySelectorAll('[data-tabs]').forEach((tabBar) => {
    tabBar.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        const sectionId = tabBar.dataset.tabs;
        const pane = tab.dataset.pane;
        tabBar.querySelectorAll('.tab').forEach((button) => button.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll(`[data-role-tabs="${sectionId}"]`).forEach((content) => {
          content.classList.toggle('active', content.dataset.pane === pane);
        });
      });
    });
  });
}

function wireConfigTabs() {
  const tabBar = document.querySelector('[data-config-tabs]');
  if (!tabBar) return;
  tabBar.querySelectorAll('.config-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      const pane = tab.dataset.configPane;
      tabBar.querySelectorAll('.config-tab').forEach((b) => b.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('[data-config-content]').forEach((content) => {
        content.classList.toggle('active', content.dataset.configContent === pane);
      });
    });
  });
}

function wireMetricToggle() {
  const btn = document.querySelector('[data-metric-toggle]');
  if (!btn) return;
  btn.addEventListener('click', () => {
    showAllMetrics = !showAllMetrics;
    document.querySelectorAll('[data-extra-metric]').forEach((card) => {
      card.classList.toggle('show-all', showAllMetrics);
    });
    btn.textContent = showAllMetrics ? 'Show fewer metrics' : 'Show all metrics';
  });
}

function wireFeedbackForm(projectData) {
  const form = document.querySelector('[data-feedback-form]');
  if (!form) return;

  const targetInput = form.querySelector('[name="target"]');
  const severityInput = form.querySelector('[name="severity"]');
  const surfaceInput = form.querySelector('[name="surface"]');
  const messageInput = form.querySelector('[name="message"]');
  const blocksAcceptanceInput = form.querySelector('[name="blocksAcceptance"]');

  const syncDraft = () => {
    feedbackDraft = {
      target: targetInput?.value || 'supervisor',
      severity: severityInput?.value || 'issue',
      surface: surfaceInput?.value || '',
      message: messageInput?.value || '',
      blocksAcceptance: Boolean(blocksAcceptanceInput?.checked),
    };
  };

  [targetInput, severityInput, surfaceInput, messageInput, blocksAcceptanceInput].forEach((input) => {
    if (!input) return;
    input.addEventListener('input', syncDraft);
    input.addEventListener('change', syncDraft);
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    syncDraft();

    if (!feedbackDraft.message.trim()) {
      feedbackNotice = { kind: 'error', text: 'Feedback message is required.' };
      render();
      return;
    }

    feedbackSubmitting = true;
    feedbackNotice = { kind: 'info', text: 'Queueing feedback...' };
    render();

    try {
      const response = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(feedbackDraft),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || `Feedback API failed: ${response.status}`);
      }

      feedbackSubmitting = false;
      feedbackNotice = {
        kind: 'ok',
        text: `Sent to ${payload.entry?.targetLabel || 'target'} at ${fmtTime(payload.entry?.createdAt)}.`,
      };
      feedbackDraft = {
        target: 'supervisor',
        severity: 'issue',
        surface: projectData.review?.url || '',
        blocksAcceptance: false,
        message: '',
      };
      await fetchAll();
    } catch (error) {
      feedbackSubmitting = false;
      feedbackNotice = {
        kind: 'error',
        text: error instanceof Error ? error.message : String(error),
      };
      render();
    }
  });
}

function wireRuntimeSettingsForm(projectData) {
  const form = document.querySelector('[data-runtime-settings-form]');
  if (!form) return;

  const supervisorModelInput = form.querySelector('[name="supervisorModel"]');
  const supervisorThinkingInput = form.querySelector('[name="supervisorThinking"]');
  const checkIntervalInput = form.querySelector('[name="checkIntervalMins"]');
  const restartGatewayInput = form.querySelector('[name="restartGateway"]');
  const agentModelInputs = Array.from(form.querySelectorAll('[data-agent-model-input]'));
  const agentThinkingInputs = Array.from(form.querySelectorAll('[data-agent-thinking-input]'));

  const syncDraft = () => {
    const agentMap = {};
    agentModelInputs.forEach((input) => {
      const id = input.dataset.agentId || '';
      if (!agentMap[id]) agentMap[id] = { id, model: '', thinking: '' };
      agentMap[id].model = input.value || '';
    });
    agentThinkingInputs.forEach((input) => {
      const id = input.dataset.agentId || '';
      if (!agentMap[id]) agentMap[id] = { id, model: '', thinking: '' };
      agentMap[id].thinking = input.value || '';
    });

    runtimeSettingsDraft = {
      supervisorModel: supervisorModelInput?.value || '',
      supervisorThinking: supervisorThinkingInput?.value || '',
      checkIntervalMins: checkIntervalInput?.value || '',
      restartGateway: Boolean(restartGatewayInput?.checked),
      agents: Object.values(agentMap),
    };
  };

  [supervisorModelInput, supervisorThinkingInput, checkIntervalInput, restartGatewayInput, ...agentModelInputs, ...agentThinkingInputs].forEach((input) => {
    if (!input) return;
    input.addEventListener('input', syncDraft);
    input.addEventListener('change', syncDraft);
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    syncDraft();

    if (!runtimeSettingsDraft.supervisorModel.trim()) {
      runtimeSettingsNotice = { kind: 'error', text: 'Supervisor model is required.' };
      render();
      return;
    }

    const missingAgent = runtimeSettingsDraft.agents.find((agent) => !agent.model.trim());
    if (missingAgent) {
      runtimeSettingsNotice = { kind: 'error', text: `Model is required for ${missingAgent.id}.` };
      render();
      return;
    }

    runtimeSettingsSubmitting = true;
    runtimeSettingsNotice = { kind: 'info', text: 'Applying settings...' };
    render();

    try {
      const response = await fetch('/api/runtime-settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          supervisor: {
            model: runtimeSettingsDraft.supervisorModel,
            thinking: runtimeSettingsDraft.supervisorThinking,
            checkIntervalMins: runtimeSettingsDraft.checkIntervalMins,
          },
          agents: runtimeSettingsDraft.agents,
          restartGateway: runtimeSettingsDraft.restartGateway,
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || `Runtime settings API failed: ${response.status}`);
      }

      runtimeSettingsSubmitting = false;
      runtimeSettingsNotice = {
        kind: 'ok',
        text: payload.note || 'Settings applied.',
      };
      runtimeSettingsDraft = null;
      await fetchAll();
    } catch (error) {
      runtimeSettingsSubmitting = false;
      runtimeSettingsNotice = {
        kind: 'error',
        text: error instanceof Error ? error.message : String(error),
      };
      render();
    }
  });
}

function isDashboardFormActive() {
  // Block refresh if user has typed any feedback message (even if focus is elsewhere)
  if (feedbackDraft.message && feedbackDraft.message.trim().length > 0) return true;
  const active = document.activeElement;
  return Boolean(
    active
    && typeof active.closest === 'function'
    && (active.closest('[data-feedback-form]') || active.closest('[data-runtime-settings-form]'))
  );
}

function render() {
  const projectData = dashboardData.project;
  const agents = dashboardData.agents || [];
  const supervisor = dashboardData.supervisor || {};
  const metrics = dashboardData.metrics || { markdown: { rows: [] }, live: { rows: [] } };
  const feedback = dashboardData.feedback || { entries: [], targets: [] };
  const controlPlane = dashboardData.controlPlane || { entries: [] };

  if (!feedbackDraft.surface) {
    feedbackDraft.surface = projectData.review?.url || '';
  }
  if (!runtimeSettingsDraft) {
    runtimeSettingsDraft = buildRuntimeSettingsDraft({
      ...projectData,
      agents,
    });
  }

  document.getElementById('project-name').textContent = projectData.name;
  document.getElementById('last-update').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  document.getElementById('header-subtitle').textContent = `${agents.length} agents · checks every ${projectData.supervisor.checkInterval}m`;
  document.title = `FleetClaw - ${projectData.name}`;

  // Section 2: Fleet Overview
  document.getElementById('fleet-overview').innerHTML = renderSummary(projectData, agents, supervisor, metrics);

  // Section 3: Health Metrics
  const analytics = metrics.analytics || {};
  document.getElementById('health-metrics').innerHTML = `
    <div class="section-header">
      <h2>Health Metrics</h2>
      <p class="section-subtitle">Operational indicators and fleet health</p>
    </div>
    ${renderMetricSections(analytics)}
  `;

  // Section 4: Fleet Lanes
  document.getElementById('fleet-lanes').innerHTML = `
    <div class="section-header">
      <h2>Fleet Lanes</h2>
      <p class="section-subtitle">Supervisor and agent detail cards</p>
    </div>
    ${renderSupervisorSection(supervisor, projectData, feedback)}
    ${agents.map(renderAgentSection).join('')}
  `;

  // Section 5: Configuration & Support
  document.getElementById('config-support').innerHTML = renderSupport(projectData, metrics, controlPlane);

  // Section 6: Role Snapshot
  document.getElementById('role-snapshot').innerHTML = renderRoleSnapshot(agents, supervisor, projectData);

  wireTabs();
  wireConfigTabs();
  wireMetricToggle();
  wireFeedbackForm(projectData);
  wireRuntimeSettingsForm({
    ...projectData,
    agents,
  });
}

function refresh() {
  fetchAll().catch((error) => {
    console.error(error);
    document.getElementById('fleet-overview').innerHTML = '';
    document.getElementById('health-metrics').innerHTML = '';
    document.getElementById('fleet-lanes').innerHTML = `<section class="card"><div class="card-body"><pre>${esc(error.message)}</pre></div></section>`;
    document.getElementById('config-support').innerHTML = '';
    document.getElementById('role-snapshot').innerHTML = '';
  });
}

refresh();
setInterval(() => {
  if (!feedbackSubmitting && !runtimeSettingsSubmitting && !isDashboardFormActive()) {
    refresh();
  }
}, 10000);
</script>
</body>
</html>
